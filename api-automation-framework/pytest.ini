[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config --html=reports/report.html --self-contained-html --alluredir=reports/allure-results --clean-alluredir
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: critical smoke tests
    regression: broader regression tests
    negative: negative path tests
filterwarnings =
    error
