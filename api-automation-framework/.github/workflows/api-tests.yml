name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - uat
          - prod

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.environment || 'qa' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quality checks
        run: |
          black --check .
          isort --check-only .
          flake8 .
          mypy .

      - name: Run API tests
        run: pytest --env="${TEST_ENV}" -n auto

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            reports
            logs
